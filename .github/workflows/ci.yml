name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check src tests app
      - name: Tests
        run: pytest
      - name: CLI smoke run (seeded)
        run: |
          crq assess profiles/dental_clinic.yaml
          crq run profiles/dental_clinic.yaml --n 20000 --xlsx /tmp/dental.xlsx
