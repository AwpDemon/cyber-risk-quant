# Local / future hosted demo. Not deployed anywhere yet.
#   docker compose -f deploy/docker-compose.yml up --build
services:
  cyber-risk-quant:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser
    mem_limit: 1g
    restart: unless-stopped
